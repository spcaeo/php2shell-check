<svg xmlns="http://www.w3.org/2000/svg" width="902" height="1284" viewBox="0 0 902 1284" role="img" aria-label="php2shell-check output for shop.example.com (test fixture wordpress-woocommerce-litespeed)">
<title>php2shell-check output for shop.example.com (test fixture wordpress-woocommerce-litespeed)</title>
<rect width="100%" height="100%" rx="10" fill="#0d1117"/>
<rect width="100%" height="34.0" rx="10" fill="#161b22"/><rect y="24.0" width="100%" height="10" fill="#161b22"/>
<circle cx="20" cy="17.0" r="6" fill="#ff5f56"/><circle cx="40" cy="17.0" r="6" fill="#ffbd2e"/><circle cx="60" cy="17.0" r="6" fill="#27c93f"/>
<text x="451" y="21.5" text-anchor="middle" fill="#7d8590" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">php2shell-check</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.0" fill="#e6edf3">
<text x="22.0" y="70.4" xml:space="preserve"><tspan fill="#7d8590">$</tspan> python3 php2shell_check.py shop.example.com</text>
<text x="22.0" y="88.4" xml:space="preserve"><tspan font-weight="700">php2shell-check 1.0.1</tspan><tspan fill="#7d8590">  shop.example.com  2026-10-22T10:44:24+00:00</tspan></text>
<text x="22.0" y="106.4" xml:space="preserve"></text>
<text x="22.0" y="124.4" xml:space="preserve"><tspan font-weight="700">Your site runs WordPress 6.8.1 on PHP 8.3.10, served by LiteSpeed. 1 thing to do now, 2 tips.</tspan></text>
<text x="22.0" y="142.4" xml:space="preserve"></text>
<text x="22.0" y="160.4" xml:space="preserve"><tspan fill="#ff7b72" font-weight="700">UPDATE NEEDED</tspan>  <tspan font-weight="700">Update needed: PHP 8.3.10 on shop.example.com</tspan></text>
<text x="22.0" y="178.4" xml:space="preserve">  We saw the header X-Powered-By: PHP/8.3.10</text>
<text x="22.0" y="196.4" xml:space="preserve"><tspan fill="#7d8590">    https://shop.example.com/</tspan></text>
<text x="22.0" y="214.4" xml:space="preserve">  This means PHP 8.3.10 is older than 8.3.36, the fixed release of its branch. A flaw in PHP lets</text>
<text x="22.0" y="232.4" xml:space="preserve">  anyone on the internet run code on the server, without signing in. LiteSpeed, which serves this</text>
<text x="22.0" y="250.4" xml:space="preserve">  site, is one of the ways of running PHP the advisory lists.</text>
<text x="22.0" y="268.4" xml:space="preserve">  What to do: Update PHP to the fixed release of its branch, then restart PHP (the FPM pool or the</text>
<text x="22.0" y="286.4" xml:space="preserve">    web server).</text>
<text x="22.0" y="304.4" xml:space="preserve"><tspan fill="#7d8590">  Source: https://www.php.net/archive/2026.php#2026-10-21-5</tspan></text>
<text x="22.0" y="322.4" xml:space="preserve"><tspan fill="#7d8590">  Source: https://www.php.net/archive/2026.php#2026-10-20-1</tspan></text>
<text x="22.0" y="340.4" xml:space="preserve">  Check it yourself:</text>
<text x="22.0" y="358.4" xml:space="preserve"><tspan fill="#7d8590">    $ </tspan>curl -sI https://shop.example.com/ | grep -i &#x27;^x-powered-by:&#x27;</text>
<text x="22.0" y="376.4" xml:space="preserve"></text>
<text x="22.0" y="394.4" xml:space="preserve"><tspan fill="#58a6ff" font-weight="700">TIP</tspan>  <tspan font-weight="700">readme.html shows WordPress 6.8.1</tspan></text>
<text x="22.0" y="412.4" xml:space="preserve">  We saw https://shop.example.com/readme.html answer 200, showing Version 6.8.1</text>
<text x="22.0" y="430.4" xml:space="preserve"><tspan fill="#7d8590">    https://shop.example.com/readme.html</tspan></text>
<text x="22.0" y="448.4" xml:space="preserve">  This means anyone can read your WordPress version there.</text>
<text x="22.0" y="466.4" xml:space="preserve">  What to do: Delete readme.html (WordPress puts it back on updates; a rule in the web server keeps</text>
<text x="22.0" y="484.4" xml:space="preserve">    it hidden).</text>
<text x="22.0" y="502.4" xml:space="preserve">  Check it yourself:</text>
<text x="22.0" y="520.4" xml:space="preserve"><tspan fill="#7d8590">    $ </tspan>curl -s https://shop.example.com/readme.html | grep -i -o &#x27;version [0-9.]*&#x27;</text>
<text x="22.0" y="538.4" xml:space="preserve"></text>
<text x="22.0" y="556.4" xml:space="preserve"><tspan fill="#58a6ff" font-weight="700">TIP</tspan>  <tspan font-weight="700">Security headers: 0 of 5</tspan></text>
<text x="22.0" y="574.4" xml:space="preserve">  We saw no Strict-Transport-Security, Content-Security-Policy, X-Frame-Options,</text>
<text x="22.0" y="592.4" xml:space="preserve">  X-Content-Type-Options and Referrer-Policy header in the home page&#x27;s answer</text>
<text x="22.0" y="610.4" xml:space="preserve"><tspan fill="#7d8590">    https://shop.example.com/</tspan></text>
<text x="22.0" y="628.4" xml:space="preserve">  This means browsers get fewer instructions to block some attacks (framing, content sniffing, mixed</text>
<text x="22.0" y="646.4" xml:space="preserve">  content). They do not fix PHP or Node.js; they are worth adding.</text>
<text x="22.0" y="664.4" xml:space="preserve">  What to do: Add Strict-Transport-Security, Content-Security-Policy, X-Frame-Options,</text>
<text x="22.0" y="682.4" xml:space="preserve">    X-Content-Type-Options and Referrer-Policy in the web server or the app.</text>
<text x="22.0" y="700.4" xml:space="preserve">  Check it yourself:</text>
<text x="22.0" y="718.4" xml:space="preserve"><tspan fill="#7d8590">    $ </tspan>curl -sI https://shop.example.com/ | grep -i -E &#x27;^(strict-transport-security|content-security-policy|x-…</text>
<text x="22.0" y="736.4" xml:space="preserve"></text>
<text x="22.0" y="754.4" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">GOOD</tspan>  <tspan font-weight="700">Login page on shop.example.com hidden or blocked (good)</tspan></text>
<text x="22.0" y="772.4" xml:space="preserve">  We saw https://shop.example.com/wp-login.php answered 302, sending visitors to</text>
<text x="22.0" y="790.4" xml:space="preserve">  https://shop.example.com/my-account/</text>
<text x="22.0" y="808.4" xml:space="preserve"><tspan fill="#7d8590">    https://shop.example.com/wp-login.php</tspan></text>
<text x="22.0" y="826.4" xml:space="preserve">  We saw https://shop.example.com/my-account/ answered 200</text>
<text x="22.0" y="844.4" xml:space="preserve"><tspan fill="#7d8590">    https://shop.example.com/my-account/</tspan></text>
<text x="22.0" y="862.4" xml:space="preserve">  We saw https://shop.example.com/my-account/ answer with a page with no login form</text>
<text x="22.0" y="880.4" xml:space="preserve"><tspan fill="#7d8590">    https://shop.example.com/my-account/</tspan></text>
<text x="22.0" y="898.4" xml:space="preserve">  This means /wp-login.php does not show a login form to strangers.</text>
<text x="22.0" y="916.4" xml:space="preserve">  What to do: Nothing to do.</text>
<text x="22.0" y="934.4" xml:space="preserve">  Check it yourself:</text>
<text x="22.0" y="952.4" xml:space="preserve"><tspan fill="#7d8590">    $ </tspan>curl -sI https://shop.example.com/wp-login.php</text>
<text x="22.0" y="970.4" xml:space="preserve"><tspan fill="#7d8590">    $ </tspan>curl -sI https://shop.example.com/my-account/</text>
<text x="22.0" y="988.4" xml:space="preserve"><tspan fill="#7d8590">    $ </tspan>curl -sL https://shop.example.com/wp-login.php | grep -c -E &#x27;loginform|name=.pwd.&#x27;</text>
<text x="22.0" y="1006.4" xml:space="preserve"></text>
<text x="22.0" y="1024.4" xml:space="preserve"><tspan font-weight="700">What we fetched (5 requests)</tspan></text>
<text x="22.0" y="1042.4" xml:space="preserve"><tspan fill="#7d8590">  METHOD  STATUS      BYTES  URL</tspan></text>
<text x="22.0" y="1060.4" xml:space="preserve">  GET     200           496  https://shop.example.com/</text>
<text x="22.0" y="1078.4" xml:space="preserve">  GET     302             0  https://shop.example.com/wp-login.php -&gt; https://shop.example.com/my-account/</text>
<text x="22.0" y="1096.4" xml:space="preserve">  GET     200            32  https://shop.example.com/my-account/</text>
<text x="22.0" y="1114.4" xml:space="preserve">  GET     403             9  https://shop.example.com/xmlrpc.php</text>
<text x="22.0" y="1132.4" xml:space="preserve">  GET     200            48  https://shop.example.com/readme.html</text>
<text x="22.0" y="1150.4" xml:space="preserve"><tspan fill="#7d8590">  User-Agent: php2shell-check/1.0.1 (+https://github.com/spcaeo/php2shell-check)</tspan></text>
<text x="22.0" y="1168.4" xml:space="preserve"></text>
<text x="22.0" y="1186.4" xml:space="preserve">This reads only what your home page shows anyone. It can&#x27;t see inside your server, and it doesn&#x27;t</text>
<text x="22.0" y="1204.4" xml:space="preserve">test for the flaw. A hidden version is not proof either way: only the server can say (php -v,</text>
<text x="22.0" y="1222.4" xml:space="preserve">node -v).</text>
<text x="22.0" y="1240.4" xml:space="preserve"><tspan fill="#7d8590">Advisories of 2026-10-21 (built in): php2shell (CVE-2026-109618, CVE-2026-109619) and Node.js</tspan></text>
<text x="22.0" y="1258.4" xml:space="preserve"><tspan fill="#7d8590">October 2026. Prefer a browser? https://skaldanalytics.com/check/</tspan></text>
</g>
