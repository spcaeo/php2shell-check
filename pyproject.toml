[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "php2shell-check"
version = "1.1.0"
description = "Is your site exposed to the October 2026 PHP flaws (php2shell, CVE-2026-109618/109619)? Reads what your home page shows anyone, with evidence for every finding."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Space-O Technologies"}]
keywords = ["php2shell", "CVE-2026-109618", "CVE-2026-109619", "php", "wordpress", "security", "vulnerability-scanner", "nodejs"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/spcaeo/php2shell-check"
Issues = "https://github.com/spcaeo/php2shell-check/issues"
"Web check" = "https://skaldanalytics.com/check/"

[project.scripts]
php2shell-check = "php2shell_check.cli:main"

[tool.setuptools]
packages = ["php2shell_check"]
